function drawL(){v.innerHTML=`<div class="card"><h2>🧳 行李清單</h2><p class="sm">備好一項就勾一項，勾選會記在這支手機上。</p><b id="lc"></b></div>`+L.map((c,ci)=>`<div class="card"><h2>${c[0]}</h2>${c[1].map((it,ii)=>`<label class="row ck"><input type="checkbox" data-k="${ci}-${ii}" ${ck[ci+'-'+ii]?'checked':''}><span><b>${it[0]}</b>${it[1]?`<br><span class="sm">${it[1]}</span>`:''}</span></label>`).join('')}</div>`).join('');lc();scrollTo(0,0)}

const CN="一二三四五六七八",TT=["出發日", "三國風雲", "最美夜景", "千年古鎮", "雲天渡橋", "來此一遊", "遙望洞庭", "平安歸途"];
let day=0;const v=document.getElementById('v'),ch=document.getElementById('chips');
const q=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
function route(){const r=(location.hash||'#day').slice(1);return['day','weather','transport','hotel','luggage'].includes(r)?r:'day'}
function draw(){const r=route();document.querySelectorAll('.tb button').forEach(b=>b.classList.toggle('on',b.dataset.r===(r==='luggage'?'day':r)));
ch.style.display=(r==='day'||r==='luggage')?'flex':'none';
if(r==='day'||r==='luggage'){ch.innerHTML=D.map((x,i)=>`<button class="chip ${r==='day'&&i===day?'on':''}" data-i="${i}">第${CN[i]}天</button>`).join('')+`<button class="chip ${r==='luggage'?'on':''}" data-l="1">🧳 行李</button>`}
if(r==='luggage'){drawL()}else if(r==='day'){
const x=D[day];v.innerHTML=`<div class="card"><h2>第${CN[day]}天　${TT[day]}</h2><b>${x.d}　${x.r}</b>${x.tl.map(a=>`<div class="row"><div class="t">${a[0]}</div><div>${q(a[1])}</div></div>`).join('')}</div><div class="meal">🍚 ${x.m}</div><div class="card"><h2>🌤️ 天氣（概估）</h2>${x.w}</div><div class="card"><h2>📖 歷史人文</h2>${x.c}</div>${x.f?`<div class="card"><h2>🍜 必吃必買</h2>${x.f}</div>`:''}${x.p?`<div class="card"><h2>📸 拍照建議</h2>${x.p}</div>`:''}`}
else if(r==='weather'){v.innerHTML=`<div class="card"><h2>AccuWeather 預報</h2><p class="sm">11/25 更新；溫度 °C（白天／夜間），風速 km/h。12/05 之後尚無預報，出發前三天請再確認。</p><div class="scroll"><table><tr><th>日期地點</th><th>白天／夜間</th><th>風</th><th>體感／降雨</th></tr>${W.map(a=>`<tr>${a.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</table></div></div><div class="card"><h3>穿衣提醒</h3>連日有雨：雨衣或折疊傘、防滑防水鞋。山上較冷，帶防風外套；平地白天偏暖，採洋蔥式穿法。</div>`}
else if(r==='transport'){v.innerHTML=`<div class="card"><h2>行前重點</h2><p>11/30 <b>11:15</b> 高雄小港機場國泰航空櫃台集合，自行託運行李。</p><p>去程：CX423 高雄→香港 13:15/15:00<br>　　＞CX938 香港→武漢 17:30/19:35</p><p>回程：CX937 武漢→香港 11:45/14:10<br>　　＞CX458 香港→高雄 16:45/18:15</p></div><div class="card"><h2>遊覽車（概估）</h2><div class="scroll"><table><tr><th>天</th><th>路段</th><th>時間</th><th>距離</th></tr>${T.map(a=>`<tr>${a.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</table></div></div><div class="card"><h3>聯絡</h3>導遊 秦逢 <a href="tel:15174426626">15174426626</a><br>領隊 林欣儀小姐｜接站牌：鑫鑫假期</div>`}
else{v.innerHTML=H.map(h=>`<div class="card"><h2>${h[0]}｜${h[1]}</h2><div class="sm">${h[2]}</div><p>📍 ${h[4]}<br>📞 <a href="tel:${h[3].replace(/-/g,'')}">${h[3]}</a><br><a href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(h[1]+' '+h[4])}" target="_blank" rel="noopener">開啟地圖</a></p><h3>🛒 周邊採買（步行估算）</h3>${h[5]}</div>`).join('')+`<p class="sm">步行時間依直線距離×1.25、每分鐘70公尺估算，僅供參考。</p>`}
scrollTo(0,0)}
ch.addEventListener('click',e=>{const b=e.target.closest('.chip');if(b){if(b.dataset.l){location.hash='luggage';return}day=+b.dataset.i;if(route()==='day')draw();else location.hash='day'}});
document.querySelector('.tb').addEventListener('click',e=>{const b=e.target.closest('button');if(b)location.hash=b.dataset.r});
v.addEventListener('change',e=>{const i=e.target;if(i.dataset&&i.dataset.k){ck[i.dataset.k]=i.checked;try{localStorage.setItem('zjj-lug',JSON.stringify(ck))}catch(x){}lc()}});
addEventListener('hashchange',draw);draw();
</script></body></html>
